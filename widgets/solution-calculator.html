<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實驗室溶液配製與稀釋計算器 (Notion Widget)</title>
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #202020;
      --border-color: #2f2f2f;
      --text-color: #e3e3e3;
      --text-secondary: #8e8e8e;
      --primary-color: #238636;
      --primary-hover: #2ea043;
      --accent-color: #1f6feb;
      --input-bg: #2d2d2d;
      --input-border: #3f3f3f;
      --result-bg: #161b22;
      --result-border: #30363d;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    /* 支援 Notion 淺色模式 */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #ffffff;
        --card-bg: #f9f9f9;
        --border-color: #e9e9e9;
        --text-color: #37352f;
        --text-secondary: #7f7f7f;
        --primary-color: #0f7b4b;
        --primary-hover: #148f58;
        --accent-color: #235fc5;
        --input-bg: #ffffff;
        --input-border: #e0e0e0;
        --result-bg: #f4f5f7;
        --result-border: #e2e8f0;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 優化嵌入式排版：移除限制高度與置中，改為自適應 */
    body {
      background-color: transparent; /* 背景透明，完美融入 Notion 區塊 */
      color: var(--text-color);
      padding: 6px;
      display: block;
    }

    .widget-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 100%; /* 自適應 Notion 欄寬 */
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .widget-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(135deg, var(--card-bg), var(--border-color));
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .widget-icon {
      font-size: 22px;
    }

    .widget-title {
      font-size: 15px;
      font-weight: 600;
    }

    .widget-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    /* 頁籤導覽 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(0, 0, 0, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      border-bottom: 2px solid transparent;
    }

    .tab-btn:hover {
      color: var(--text-color);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--text-color);
      font-weight: 600;
      border-bottom-color: var(--accent-color);
      background-color: var(--card-bg);
    }

    .tab-content {
      padding: 14px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 表單樣式 */
    .form-group {
      margin-bottom: 12px;
    }

    .form-row-2 {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row-2 .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-color);
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 8px 40px 8px 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent-color);
    }

    .input-unit {
      position: absolute;
      right: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .calc-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .calc-btn:hover {
      background-color: var(--primary-hover);
    }

    /* 結果呈現 */
    .result-box {
      margin-top: 14px;
      padding: 12px;
      background-color: var(--result-bg);
      border: 1px solid var(--result-border);
      border-radius: 8px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .result-value {
      font-size: 18px;
      font-weight: 700;
      color: #3fb950;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    @media (prefers-color-scheme: light) {
      .result-value {
        color: #0f7b4b;
      }
    }

    .result-value-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-color);
    }

    .result-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .formula-badge {
      display: inline-block;
      padding: 2px 6px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: monospace;
      font-size: 9px;
      margin-top: 6px;
      color: var(--text-secondary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="widget-container" id="solutionWidget">
    <div class="widget-header">
      <span class="widget-icon">🧪</span>
      <div>
        <h1 class="widget-title">溶液配製與稀釋助手</h1>
        <p class="widget-subtitle">COA 實驗室智慧管理輔助工具</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabPowderBtn" onclick="switchTab('powder')">標準品配製濃度</button>
      <button class="tab-btn" id="tabLiquidBtn" onclick="switchTab('liquid')">母液/標準液稀釋</button>
    </div>

    <!-- 頁籤一：固體標準品配製濃度 (考慮稱重、純度與分子量成鹽校正) -->
    <div class="tab-content active" id="tabPowderContent">
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="powWeight">實際稱重重量 (W)</label>
          <div class="input-wrapper">
            <input type="number" id="powWeight" class="form-input" placeholder="例如: 10.24" step="any" min="0">
            <span class="input-unit">mg</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="powTargetVol">定量體積 (V)</label>
          <div class="input-wrapper">
            <input type="number" id="powTargetVol" class="form-input" placeholder="例如: 10" step="any" min="0">
            <span class="input-unit">mL</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="powPurity">標準品純度 (Purity - 來自COA)</label>
        <div class="input-wrapper">
          <input type="number" id="powPurity" class="form-input" placeholder="例如: 98.5" value="100" step="any" min="0" max="100">
          <span class="input-unit">%</span>
        </div>
      </div>

      <!-- 成鹽/結晶水校正分子量欄位 -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="powActiveMW">目標物純分子量 (MW_free)</label>
          <div class="input-wrapper">
            <input type="number" id="powActiveMW" class="form-input" placeholder="例如: 150" step="any" min="0">
            <span class="input-unit">g/mol</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="powSubstanceMW">購買藥品分子量 (MW_salt)</label>
          <div class="input-wrapper">
            <input type="number" id="powSubstanceMW" class="form-input" placeholder="例如: 180" step="any" min="0">
            <span class="input-unit">g/mol</span>
          </div>
        </div>
      </div>

      <button type="button" id="btnCalcPowder" class="calc-btn" onclick="calculatePowder()">
        <span>計算配製濃度</span>
      </button>

      <div class="result-box" id="resultPowder">
        <div class="result-title">配製標準溶液濃度</div>
        <div class="result-value" id="valPowder">0.00 <span class="result-value-unit">ppm (mg/L)</span></div>
        <p class="result-desc" id="descPowder"></p>
        <div class="formula-badge">公式: C = (W × Purity × F × 10) / V</div>
      </div>
    </div>

    <!-- 頁籤二：母液稀釋 -->
    <div class="tab-content" id="tabLiquidContent">
      <div class="form-group">
        <label class="form-label" for="liqStockConc">原始母液濃度 (C1)</label>
        <div class="input-wrapper">
          <input type="number" id="liqStockConc" class="form-input" placeholder="例如: 1000" step="any" min="0">
          <span class="input-unit">ppm</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="liqTargetConc">目標稀釋濃度 (C2)</label>
        <div class="input-wrapper">
          <input type="number" id="liqTargetConc" class="form-input" placeholder="例如: 10" step="any" min="0">
          <span class="input-unit">ppm</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="liqTargetVol">目標稀釋體積 (V2)</label>
        <div class="input-wrapper">
          <input type="number" id="liqTargetVol" class="form-input" placeholder="例如: 10" step="any" min="0">
          <span class="input-unit">mL</span>
        </div>
      </div>

      <button type="button" id="btnCalcLiquid" class="calc-btn" onclick="calculateLiquid()">
        <span>計算移取體積</span>
      </button>

      <div class="result-box" id="resultLiquid">
        <div class="result-title">計算稀釋結果</div>
        <div class="result-value" id="valLiquid">0.000 <span class="result-value-unit">μL</span></div>
        <p class="result-desc" id="descLiquid"></p>
        <div class="formula-badge">公式: V1 = (C2 × V2) / C1</div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tabPowderBtn').classList.toggle('active', tab === 'powder');
      document.getElementById('tabLiquidBtn').classList.toggle('active', tab === 'liquid');

      document.getElementById('tabPowderContent').classList.toggle('active', tab === 'powder');
      document.getElementById('tabLiquidContent').classList.toggle('active', tab === 'liquid');
    }

    function calculatePowder() {
      const weight = parseFloat(document.getElementById('powWeight').value);
      const vol = parseFloat(document.getElementById('powTargetVol').value);
      const purity = parseFloat(document.getElementById('powPurity').value);
      
      let activeMW = parseFloat(document.getElementById('powActiveMW').value);
      let substanceMW = parseFloat(document.getElementById('powSubstanceMW').value);

      const resultBox = document.getElementById('resultPowder');

      if (isNaN(weight) || isNaN(vol) || isNaN(purity) || weight <= 0 || vol <= 0 || purity <= 0) {
        alert("請輸入大於 0 的有效數值！");
        return;
      }

      // 預設校正係數為 1.0 (當分子量欄位未填或填 0 時)
      let factor = 1.0;
      let factorDesc = '';

      if (!isNaN(activeMW) && !isNaN(substanceMW) && activeMW > 0 && substanceMW > 0) {
        factor = activeMW / substanceMW;
        factorDesc = `<br>🔹 結晶水/成鹽校正係數 (F): ${factor.toFixed(3)} (MW: ${activeMW} / ${substanceMW})`;
      }

      // C (ppm) = (W * Purity% * F * 1000) / V = (W * (purity/100) * factor * 1000) / V = (W * purity * factor * 10) / V
      const concPpm = (weight * purity * factor * 10) / vol;

      document.getElementById('valPowder').innerHTML = `${concPpm.toFixed(2)} <span class="result-value-unit">ppm (mg/L)</span>`;
      document.getElementById('descPowder').innerHTML = `配製指引：稱取標準品固體 ${weight} mg，放入容量瓶中並定容至 ${vol} mL。因標準品純度為 ${purity}%${factorDesc}，扣除雜質與鹽/結晶水分子量換算後，最終獲得的有效成分濃度為 <b>${concPpm.toFixed(2)} ppm</b>。`;
      
      resultBox.style.display = 'block';
    }

    function calculateLiquid() {
      const c1 = parseFloat(document.getElementById('liqStockConc').value);
      const c2 = parseFloat(document.getElementById('liqTargetConc').value);
      const v2 = parseFloat(document.getElementById('liqTargetVol').value);
      const resultBox = document.getElementById('resultLiquid');

      if (isNaN(c1) || isNaN(c2) || isNaN(v2) || c1 <= 0 || c2 <= 0 || v2 <= 0) {
        alert("請輸入大於 0 的有效數值！");
        return;
      }

      if (c2 >= c1) {
        alert("目標稀釋濃度 (C2) 必須小於原始母液濃度 (C1)！");
        return;
      }

      const v1Ml = (c2 * v2) / c1;
      const v1Ul = v1Ml * 1000;
      const diluentVol = v2 - v1Ml;

      let valueHtml = '';
      let descText = '';

      if (v1Ul < 1000) {
        valueHtml = `${v1Ul.toFixed(2)} <span class="result-value-unit">μL</span>`;
        descText = `配製指引：使用微量吸管移取母液 ${v1Ul.toFixed(2)} μL (即 ${v1Ml.toFixed(5)} mL)，加入容量瓶，再加入稀釋溶劑 ${diluentVol.toFixed(3)} mL 定容至 ${v2} mL 刻度。`;
      } else {
        valueHtml = `${v1Ml.toFixed(3)} <span class="result-value-unit">mL</span>`;
        descText = `配製指引：移取母液 ${v1Ml.toFixed(3)} mL，加入容量瓶，再加入稀釋溶劑 ${diluentVol.toFixed(3)} mL 定容至 ${v2} mL 刻度。`;
      }

      document.getElementById('valLiquid').innerHTML = valueHtml;
      document.getElementById('descLiquid').innerText = descText;
      
      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
